name: Ubuntu

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  BUILD_TYPE: Release

jobs:
  build:
    strategy:
      matrix:
        os: [ ubuntu-22.04, ubuntu-22.04-arm ]

    runs-on: ${{ matrix.os }}
    continue-on-error: true
    timeout-minutes: 10

    steps:
    - uses: actions/checkout@v6
      with:
        submodules: recursive

    - name: Install Packages
      run: |
        sudo apt-get install -y clang-tidy-15

    - name: Configure GCC 12
      run: |
        echo "CC=/usr/bin/gcc-12" >> $GITHUB_ENV
        echo "CXX=/usr/bin/g++-12" >> $GITHUB_ENV

    - name: Configure CMake
      run: cmake -B ${{github.workspace}}/build -DLINT=ON -DCMAKE_POLICY_VERSION_MINIMUM="3.5" -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} -DBUILD_TESTING=ON -DQUICR_BUILD_EXAMPLES=ON

    - name: Build
      run: cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}} -j

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v7
      with:
        name: ${{matrix.os}}-build-output
        path: ${{github.workspace}}/build
        retention-days: 5

  test:
    needs: build
    if: ${{ needs.build.result == 'success' }}
    strategy:
      matrix:
        os: [ ubuntu-22.04, ubuntu-22.04-arm ]

    runs-on: ${{ matrix.os }}
    continue-on-error: true
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Download Build Artifact
        uses: actions/download-artifact@v7
        with:
          name: ${{matrix.os}}-build-output
          path: ${{github.workspace}}/build

      - name: Test
        working-directory: ${{github.workspace}}/build
        run: |
          chmod -R +rx ${{github.workspace}}/build
          ctest -C ${{env.BUILD_TYPE}} --output-on-failure -E "benchmark"

  benchmark:
    needs: build
    if: ${{ needs.build.result == 'success' }}
    strategy:
      matrix:
        os: [ ubuntu-22.04, ubuntu-22.04-arm ]

    runs-on: ${{ matrix.os }}
    continue-on-error: true
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Download Build Artifact
        uses: actions/download-artifact@v7
        with:
          name: ${{matrix.os}}-build-output
          path: ${{github.workspace}}/build

      - name: Benchmark
        working-directory: ${{github.workspace}}/build
        run: |
          chmod -R +rx ${{github.workspace}}/build
          ctest -C ${{env.BUILD_TYPE}} -R "benchmark" --verbose
