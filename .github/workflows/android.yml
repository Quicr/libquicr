name: Android

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

env:
  BUILD_TYPE: Release
  ANDROID_API: 24
  NDK_VERSION: 30.0.16248370 # r30 LTS

jobs:
  build:
    name: Android (${{ matrix.abi }})
    strategy:
      fail-fast: false
      matrix:
        abi: [ arm64-v8a, x86_64 ]

    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6

      - name: Install Android NDK
        run: ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager --install "ndk;${{ env.NDK_VERSION }}"

      - name: Configure CMake
        run: >
          cmake -S ${{ github.workspace }}
          -B ${{ github.workspace }}/build
          -G Ninja
          -DCMAKE_TOOLCHAIN_FILE=${ANDROID_SDK_ROOT}/ndk/${{ env.NDK_VERSION }}/build/cmake/android.toolchain.cmake
          -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}
          -DCMAKE_POLICY_VERSION_MINIMUM=3.5
          -DANDROID_ABI=${{ matrix.abi }}
          -DANDROID_PLATFORM=android-${{ env.ANDROID_API }}
          -DWITH_MBEDTLS=OFF
          -DBUILD_TESTING=OFF
          -DQUICR_BUILD_TESTS=OFF
          -DQUICR_BUILD_EXAMPLES=OFF
          -DQUICR_BUILD_BENCHMARKS=OFF

      - name: Build
        run: cmake --build ${{ github.workspace }}/build -j
