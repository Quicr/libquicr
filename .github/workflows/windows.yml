name: Windows

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

env:
  BUILD_TYPE: Release
  SCCACHE_GHA_ENABLED: "true"

defaults:
  run:
    shell: pwsh

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6

      - name: Set up MSVC environment
        # Ninja, unlike the Visual Studio generator, needs cl.exe and the SDK
        # already in the environment.
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Set up compiler cache
        uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: "v0.16.0"

      - name: Configure CMake
        # Ninja is faster than the Visual Studio generator and is single-config,
        # so the build type is fixed here rather than at --build time.
        run: >
          cmake -B ${{ github.workspace }}/build
          -G Ninja
          -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}
          -DCMAKE_C_COMPILER_LAUNCHER=sccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=sccache
          -DCMAKE_POLICY_VERSION_MINIMUM="3.5"
          -DBUILD_TESTING=ON
          -DQUICR_BUILD_EXAMPLES=ON
          -DQUICR_BUILD_TOOLS=ON
          -DLINT=OFF

      - name: Build
        run: cmake --build ${{ github.workspace }}/build -j

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v7
        with:
          name: windows-build-output
          # Link-time-only output, and the bulk of a Windows build tree. Running
          # an already-linked test needs the .exe and .dll, none of this.
          path: |
            ${{ github.workspace }}/build
            !${{ github.workspace }}/build/**/*.obj
            !${{ github.workspace }}/build/**/*.ilk
            !${{ github.workspace }}/build/**/*.lib
          # Build outputs are already dense; avoid spending runner time trying
          # to compress them further.
          compression-level: 0
          retention-days: 5

  # Keep these separate so failed tests or benchmarks can be rerun without
  # rebuilding. The build tree records absolute paths, so all jobs use the same
  # GitHub workspace location.
  test:
    needs: build
    if: ${{ needs.build.result == 'success' }}
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v6

      - name: Download Build Artifact
        uses: actions/download-artifact@v7
        with:
          name: windows-build-output
          path: ${{ github.workspace }}/build

      - name: Test
        working-directory: ${{ github.workspace }}/build
        run: ctest --output-on-failure --parallel

  benchmark:
    needs: build
    if: ${{ needs.build.result == 'success' }}
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v6

      - name: Download Build Artifact
        uses: actions/download-artifact@v7
        with:
          name: windows-build-output
          path: ${{ github.workspace }}/build

      - name: Benchmark
        working-directory: ${{ github.workspace }}/build
        run: .\benchmark\quicr_benchmark.exe
