name: Windows

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

env:
  BUILD_TYPE: Release
  CPM_SOURCE_CACHE: "${{ github.workspace }}\\.cache\\CPM"
  SCCACHE_GHA_ENABLED: "true"
  VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}\\vcpkg-cache\\archives,readwrite"
  VCPKG_DOWNLOADS: "${{ github.workspace }}\\vcpkg-cache\\downloads"

defaults:
  run:
    shell: pwsh

jobs:
  build:
    runs-on: windows-latest
    # A cold vcpkg cache builds OpenSSL from source.
    timeout-minutes: 75

    steps:
      - uses: actions/checkout@v6

      - name: Check out the pinned vcpkg baseline
        uses: actions/checkout@v6
        with:
          repository: microsoft/vcpkg
          ref: 3d33b7f7a8121da6e4fa80b35618fc8e960be686
          path: dependencies/vcpkg

      - name: Create CI dependency manifest
        run: |
          New-Item -ItemType Directory -Force `
            ${{ github.workspace }}/.ci-vcpkg | Out-Null
          @'
          {
            "name": "quicr-windows-ci",
            "version-string": "0",
            "dependencies": [
              "pkgconf",
              "openssl"
            ],
            "builtin-baseline": "3d33b7f7a8121da6e4fa80b35618fc8e960be686"
          }
          '@ | Set-Content -Encoding utf8NoBOM `
            ${{ github.workspace }}/.ci-vcpkg/vcpkg.json

      - name: Set up MSVC environment
        # Ninja, unlike the Visual Studio generator, needs cl.exe and the SDK
        # already in the environment.
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Bootstrap vcpkg
        run: >
          ${{ github.workspace }}/dependencies/vcpkg/bootstrap-vcpkg.bat
          -disableMetrics

      - name: Cache vcpkg installed tree
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/build/vcpkg_installed
          # No restore-keys: a tree from another manifest is worse than a rebuild.
          key: vcpkg-installed-x64-windows-release-${{ hashFiles('.ci-vcpkg/vcpkg.json') }}

      - name: Cache vcpkg packages and downloads
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/vcpkg-cache
          # Binary packages are content-addressed, so older manifest caches are
          # safe to reuse when only some dependency versions change.
          key: vcpkg-binary-x64-windows-release-${{ hashFiles('.ci-vcpkg/vcpkg.json') }}
          restore-keys: |
            vcpkg-binary-x64-windows-release-

      - name: Cache CPM sources
        uses: actions/cache@v6
        with:
          path: ${{ env.CPM_SOURCE_CACHE }}
          key: cpm-windows-${{ hashFiles('cmake/QuicrDependencies.cmake') }}
          restore-keys: |
            cpm-windows-

      - name: Set up compiler cache
        uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: "v0.16.0"

      - name: Configure CMake
        # Ninja is faster than the Visual Studio generator and is single-config,
        # so the build type is fixed here rather than at --build time.
        # The manifest is generated by this job so package-manager policy remains
        # with the CI consumer rather than becoming part of libquicr's interface.
        run: >
          cmake -B ${{ github.workspace }}/build
          -G Ninja
          -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}
          -DCMAKE_C_COMPILER_LAUNCHER=sccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=sccache
          -DCMAKE_POLICY_VERSION_MINIMUM="3.5"
          -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/dependencies/vcpkg/scripts/buildsystems/vcpkg.cmake
          -DVCPKG_MANIFEST_DIR=${{ github.workspace }}/.ci-vcpkg
          -DVCPKG_TARGET_TRIPLET=x64-windows-release
          -DBUILD_TESTING=ON
          -DQUICR_BUILD_EXAMPLES=ON
          -DLINT=OFF

      - name: Build
        run: cmake --build ${{ github.workspace }}/build -j

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v7
        with:
          name: windows-build-output
          # Link-time-only output, and the bulk of a Windows build tree. Running
          # an already-linked test needs the .exe and .dll, none of this.
          path: |
            ${{ github.workspace }}/build
            !${{ github.workspace }}/build/**/*.obj
            !${{ github.workspace }}/build/**/*.ilk
            !${{ github.workspace }}/build/**/*.lib
          # Build outputs are already dense; avoid spending runner time trying
          # to compress them further.
          compression-level: 0
          retention-days: 5

  # Keep these separate so failed tests or benchmarks can be rerun without
  # rebuilding. The build tree records absolute paths, so all jobs use the same
  # GitHub workspace location.
  test:
    needs: build
    if: ${{ needs.build.result == 'success' }}
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v6

      - name: Download Build Artifact
        uses: actions/download-artifact@v7
        with:
          name: windows-build-output
          path: ${{ github.workspace }}/build

      - name: Test
        working-directory: ${{ github.workspace }}/build
        run: ctest --output-on-failure --parallel

  benchmark:
    needs: build
    if: ${{ needs.build.result == 'success' }}
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v6

      - name: Download Build Artifact
        uses: actions/download-artifact@v7
        with:
          name: windows-build-output
          path: ${{ github.workspace }}/build

      - name: Benchmark
        working-directory: ${{ github.workspace }}/build
        run: .\benchmark\quicr_benchmark.exe
