name: macOS

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  BUILD_TYPE: Release

jobs:
  build:
    runs-on: macos-latest
    continue-on-error: true
    timeout-minutes: 10

    steps:
    - uses: actions/checkout@v6
      with:
        submodules: recursive

    - name: Install Packages
      # Builds against Homebrew's clang rather than the Xcode one. LINT=ON also
      # needs clang-tidy, which Homebrew's llvm keeps off PATH.
      run: |
        HOMEBREW_NO_REQUIRE_TAP_TRUST=1 brew install llvm google-benchmark
        LLVM_PREFIX="$(brew --prefix llvm)"
        echo "CC=$LLVM_PREFIX/bin/clang" >> "$GITHUB_ENV"
        echo "CXX=$LLVM_PREFIX/bin/clang++" >> "$GITHUB_ENV"
        echo "$LLVM_PREFIX/bin" >> "$GITHUB_PATH"
        ln -s "$LLVM_PREFIX/bin/clang-tidy" "/usr/local/bin/clang-tidy"

    - name: Configure CMake
      run: cmake -B ${{github.workspace}}/build -DLINT=ON -DCMAKE_POLICY_VERSION_MINIMUM="3.5" -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} -DBUILD_TESTING=ON -DQUICR_BUILD_EXAMPLES=ON

    - name: Build
      run: cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}} -j

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v7
      with:
        name: macos-build-output
        path: ${{github.workspace}}/build
        retention-days: 5

  test:
    needs: build
    if: ${{ needs.build.result == 'success' }}
    runs-on: macos-latest
    continue-on-error: true
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Download Build Artifact
        uses: actions/download-artifact@v7
        with:
          name: macos-build-output
          path: ${{github.workspace}}/build

      - name: Test
        working-directory: ${{github.workspace}}/build
        run: |
          chmod -R +rx ${{github.workspace}}/build
          ctest -C ${{env.BUILD_TYPE}} --output-on-failure -E "benchmark"

  benchmark:
    needs: build
    if: ${{ needs.build.result == 'success' }}
    runs-on: macos-latest
    continue-on-error: true
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Download Build Artifact
        uses: actions/download-artifact@v7
        with:
          name: macos-build-output
          path: ${{github.workspace}}/build

      - name: Benchmark
        working-directory: ${{github.workspace}}/build
        run: |
          chmod -R +rx ${{github.workspace}}/build
          ctest -C ${{env.BUILD_TYPE}} -R "benchmark" --verbose
