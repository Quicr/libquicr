name: TLS Backends

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

env:
  BUILD_TYPE: Release

jobs:
  no-external-backend:
    name: No external TLS backend
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6

      - name: Configure GCC 12
        run: |
          echo "CC=/usr/bin/gcc-12" >> "$GITHUB_ENV"
          echo "CXX=/usr/bin/g++-12" >> "$GITHUB_ENV"

      - name: Configure CMake
        run: >
          cmake -B "${{ github.workspace }}/build"
          -DCMAKE_POLICY_VERSION_MINIMUM=3.5
          -DCMAKE_BUILD_TYPE="${{ env.BUILD_TYPE }}"
          -DBUILD_TESTING=ON
          -DQUICR_BUILD_TESTS=ON
          -DQUICR_BUILD_EXAMPLES=OFF
          -DQUICR_BUILD_BENCHMARKS=OFF
          -DWITH_OPENSSL=OFF
          -DWITH_MBEDTLS=OFF
          -DCMAKE_DISABLE_FIND_PACKAGE_OpenSSL=TRUE

      - name: Build
        run: cmake --build "${{ github.workspace }}/build" --config "${{ env.BUILD_TYPE }}" -j

      - name: Test
        working-directory: ${{ github.workspace }}/build
        run: ctest -C "${{ env.BUILD_TYPE }}" --output-on-failure

  openssl:
    name: OpenSSL
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6

      - name: Configure GCC 12
        run: |
          echo "CC=/usr/bin/gcc-12" >> "$GITHUB_ENV"
          echo "CXX=/usr/bin/g++-12" >> "$GITHUB_ENV"

      - name: Configure CMake
        run: >
          cmake -B "${{ github.workspace }}/build"
          -DCMAKE_POLICY_VERSION_MINIMUM=3.5
          -DCMAKE_BUILD_TYPE="${{ env.BUILD_TYPE }}"
          -DBUILD_TESTING=ON
          -DQUICR_BUILD_EXAMPLES=OFF
          -DQUICR_BUILD_BENCHMARKS=OFF
          -DWITH_OPENSSL=ON
          -DWITH_MBEDTLS=OFF

      - name: Build
        run: cmake --build "${{ github.workspace }}/build" --config "${{ env.BUILD_TYPE }}" -j

      - name: Test
        working-directory: ${{ github.workspace }}/build
        run: ctest -C "${{ env.BUILD_TYPE }}" --output-on-failure

  mbedtls:
    name: MbedTLS
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6

      - name: Configure GCC 12
        run: |
          echo "CC=/usr/bin/gcc-12" >> "$GITHUB_ENV"
          echo "CXX=/usr/bin/g++-12" >> "$GITHUB_ENV"

      - name: Check out Mbed TLS
        uses: actions/checkout@v6
        with:
          repository: Mbed-TLS/mbedtls
          ref: mbedtls-3.6.7
          path: dependencies/mbedtls
          submodules: recursive

      - name: Verify Mbed TLS revision
        working-directory: ${{ github.workspace }}/dependencies/mbedtls
        run: test "$(git rev-parse HEAD)" = "068ff080b369adfac81509f9b57b2afabaf82dc5"

      - name: Build Mbed TLS
        run: >
          cmake -S "${{ github.workspace }}/dependencies/mbedtls"
          -B "${{ github.workspace }}/dependencies/mbedtls-build"
          -DCMAKE_BUILD_TYPE="${{ env.BUILD_TYPE }}"
          -DENABLE_TESTING=OFF
          -DENABLE_PROGRAMS=OFF
          -DDISABLE_PACKAGE_CONFIG_AND_INSTALL=ON
          &&
          cmake --build "${{ github.workspace }}/dependencies/mbedtls-build"
          --config "${{ env.BUILD_TYPE }}" -j

      - name: Configure CMake
        run: >
          cmake -B "${{ github.workspace }}/build"
          -DCMAKE_POLICY_VERSION_MINIMUM=3.5
          -DCMAKE_BUILD_TYPE="${{ env.BUILD_TYPE }}"
          -DBUILD_TESTING=ON
          -DQUICR_BUILD_EXAMPLES=OFF
          -DQUICR_BUILD_BENCHMARKS=OFF
          -DWITH_OPENSSL=OFF
          -DWITH_MBEDTLS=ON
          -DMBEDTLS_INCLUDE_DIR="${{ github.workspace }}/dependencies/mbedtls/include"
          -DMBEDTLS_INCLUDE_DIRS="${{ github.workspace }}/dependencies/mbedtls/include"
          -DMBEDTLS_LIBRARY="${{ github.workspace }}/dependencies/mbedtls-build/library/libmbedtls.a"
          -DMBEDTLS_X509="${{ github.workspace }}/dependencies/mbedtls-build/library/libmbedx509.a"
          -DMBEDTLS_CRYPTO="${{ github.workspace }}/dependencies/mbedtls-build/library/libmbedcrypto.a"

      - name: Build
        run: cmake --build "${{ github.workspace }}/build" --config "${{ env.BUILD_TYPE }}" -j

      - name: Test
        working-directory: ${{ github.workspace }}/build
        run: ctest -C "${{ env.BUILD_TYPE }}" --output-on-failure

  boringssl:
    name: BoringSSL
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6

      - name: Configure GCC 12
        run: |
          echo "CC=/usr/bin/gcc-12" >> "$GITHUB_ENV"
          echo "CXX=/usr/bin/g++-12" >> "$GITHUB_ENV"

      - name: Check out BoringSSL
        uses: actions/checkout@v6
        with:
          repository: google/boringssl
          ref: 0.20260929.0
          path: dependencies/boringssl

      - name: Verify BoringSSL revision
        working-directory: ${{ github.workspace }}/dependencies/boringssl
        run: test "$(git rev-parse HEAD)" = "427ec40cc8edc545253289232e885708c409e5ea"

      - name: Build BoringSSL
        run: >
          cmake -S "${{ github.workspace }}/dependencies/boringssl"
          -B "${{ github.workspace }}/dependencies/boringssl-build"
          -DCMAKE_BUILD_TYPE="${{ env.BUILD_TYPE }}"
          -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/dependencies/boringssl-install"
          -DBUILD_TESTING=OFF
          &&
          cmake --build "${{ github.workspace }}/dependencies/boringssl-build"
          --target crypto ssl decrepit bssl --parallel 2
          &&
          cmake --install "${{ github.workspace }}/dependencies/boringssl-build"
          &&
          cmake -E copy
          "${{ github.workspace }}/dependencies/boringssl-build/libdecrepit.a"
          "${{ github.workspace }}/dependencies/boringssl-install/lib/libdecrepit.a"

      - name: Configure CMake
        run: >
          cmake -B "${{ github.workspace }}/build"
          -DCMAKE_POLICY_VERSION_MINIMUM=3.5
          -DCMAKE_BUILD_TYPE="${{ env.BUILD_TYPE }}"
          -DBUILD_TESTING=ON
          -DQUICR_BUILD_EXAMPLES=OFF
          -DQUICR_BUILD_BENCHMARKS=OFF
          -DWITH_OPENSSL=ON
          -DWITH_MBEDTLS=OFF
          -DOPENSSL_ROOT_DIR="${{ github.workspace }}/dependencies/boringssl-install"

      - name: Build
        run: cmake --build "${{ github.workspace }}/build" --config "${{ env.BUILD_TYPE }}" -j

      - name: Test
        working-directory: ${{ github.workspace }}/build
        run: ctest -C "${{ env.BUILD_TYPE }}" --output-on-failure
